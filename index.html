<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panou Comenzi TikTok Live</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: none; font-size: 16px; }
        input { background: #2c2c2c; color: white; width: calc(100% - 22px); }
        button { background: #fe2c55; color: white; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background: #e02448; }
        .status { padding: 10px; border-radius: 5px; margin-top: 10px; text-align: center; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        .castigator { background-color: rgba(37, 244, 238, 0.15); border-left: 4px solid #25f4ee; }
        .rezerva { opacity: 0.6; }
        .badge-win { background: #25f4ee; color: #000; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-res { background: #555; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Manager Comenzi TikTok Live</h2>

    <!-- Conectare la Live -->
    <div class="card">
        <h3>1. Conectare la Contul TikTok</h3>
        <input type="text" id="tiktokUser" placeholder="Introdu username-ul (ex: marfahub)">
        <button onclick="conectareLive()">Conectează-te la Live</button>
        <div id="statusBox" class="status" style="background: #333;">Neconectat</div>
    </div>

    <!-- Setare Produs -->
    <div class="card">
        <h3>2. Start Produs Nou (Resetează lista)</h3>
        <input type="text" id="cuvantCheie" placeholder="Cuvânt cheie (ex: scaun)">
        <input type="number" id="stocProdus" placeholder="Câte bucăți sunt pe stoc? (ex: 5)" value="5">
        <button style="background: #25f4ee; color: #000;" onclick="seteazaProdus()">Pornește Comenzile pentru acest Produs</button>
    </div>

    <!-- Lista ordonata -->
    <div class="card">
        <h3>3. Ordinea Clienților (<span id="produsActiv">Niciun produs activ</span>)</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Client</th>
                    <th>Ultimele 3 cifre</th>
                    <th>Mesaj</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabelComenzi"></tbody>
        </table>
    </div>
</div>

<script>
    // Dacă rulezi serverul pe laptop, lasă localhost:3000. Dacă îl pui pe Render/Railway, pune link-ul de acolo.
    const socket = io('http://localhost:3000');

    function conectareLive() {
        const username = document.getElementById('tiktokUser').value;
        if (!username) return alert('Introdu un nume de utilizator!');
        document.getElementById('statusBox').innerText = 'Se conectează...';
        socket.emit('conectare_tiktok', { username });
    }

    function seteazaProdus() {
        const cuvant = document.getElementById('cuvantCheie').value;
        const stoc = document.getElementById('stocProdus').value;
        if (!cuvant) return alert('Introdu un cuvânt cheie!');
        socket.emit('produs_nou', { cuvant, stoc });
    }

    socket.on('status_tiktok', (data) => {
        const box = document.getElementById('statusBox');
        box.innerText = data.mesaj;
        box.style.background = data.conectat ? '#1b4d3e' : '#661a1a';
    });

    socket.on('actualizare_lista', (data) => {
        document.getElementById('produsActiv').innerText = data.cuvântCheieCurent 
            ? `Cuvânt: "${data.cuvântCheieCurent}" | Stoc: ${data.stocMaxim} buc.` 
            : 'Niciun produs activ';

        const tbody = document.getElementById('tabelComenzi');
        tbody.innerHTML = '';

        data.listaComenzi.forEach(c => {
            const tr = document.createElement('tr');
            tr.className = c.status === 'CÂȘTIGĂTOR' ? 'castigator' : 'rezerva';
            
            const badge = c.status === 'CÂȘTIGĂTOR' 
                ? `<span class="badge-win">ALOCAT</span>` 
                : `<span class="badge-res">REZERVĂ</span>`;

            tr.innerHTML = `
                <td><strong>${c.ordine}</strong></td>
                <td>${c.nume} <br><small style="color:#aaa">@${c.user}</small></td>
                <td><strong style="font-size: 18px; color: #25f4ee;">***${c.cifre}</strong></td>
                <td>${c.mesajComplet} <br><small style="color:#777">${c.ora}</small></td>
                <td>${badge}</td>
            `;
            tbody.appendChild(tr);
        });
    });
</script>

</body>
</html>
